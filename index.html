<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday Purvii 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 650px;
      padding: 25px;
      text-align: center;
      position: relative;
      z-index: 5;
    }

    .card {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 30px;
      padding: 45px 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      animation: cardIn 1.2s ease;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: scale(0.7) translateY(50px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .cake {
      font-size: 80px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    h1 {
      font-size: clamp(38px, 10vw, 70px);
      margin: 10px 0;
      text-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .name {
      color: #fff;
      font-weight: 800;
      animation: glow 1.8s infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 5px #fff;
      }
      to {
        text-shadow:
          0 0 10px #fff,
          0 0 25px #ffeb3b,
          0 0 40px #ff69b4;
      }
    }

    .message {
      font-size: 18px;
      line-height: 1.7;
      margin: 20px auto;
      max-width: 500px;
    }

    .wish {
      font-size: 21px;
      font-weight: bold;
      margin: 20px 0;
    }

    button {
      border: none;
      padding: 14px 28px;
      border-radius: 50px;
      background: linear-gradient(45deg, #ff4081, #ff9800);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
    }

    button:active {
      transform: scale(0.95);
    }

    /* Balloons */

    .balloon {
      position: fixed;
      bottom: -150px;
      font-size: 60px;
      animation: fly 8s linear infinite;
      z-index: 1;
    }

    .balloon:nth-child(1) {
      left: 5%;
      animation-delay: 0s;
    }

    .balloon:nth-child(2) {
      left: 25%;
      animation-delay: 2s;
    }

    .balloon:nth-child(3) {
      right: 20%;
      animation-delay: 4s;
    }

    .balloon:nth-child(4) {
      right: 5%;
      animation-delay: 1s;
    }

    @keyframes fly {
      0% {
        transform: translateY(0) rotate(-5deg);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      50% {
        transform: translateY(-55vh) rotate(8deg);
      }

      100% {
        transform: translateY(-120vh) rotate(-8deg);
        opacity: 0;
      }
    }

    /* Confetti */

    .confetti {
      position: fixed;
      width: 10px;
      height: 15px;
      top: -20px;
      z-index: 10;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }

    .footer {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }

    /* Mobile */

    @media (max-width: 600px) {

      body {
        align-items: center;
      }

      .container {
        padding: 15px;
      }

      .card {
        padding: 35px 18px;
        border-radius: 25px;
      }

      .cake {
        font-size: 65px;
      }

      h1 {
        font-size: 42px;
      }

      .message {
        font-size: 16px;
      }

      .wish {
        font-size: 18px;
      }

      button {
        width: 90%;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- Balloons -->
  <div class="balloon">🎈</div>
  <div class="balloon">🎈</div>
  <div class="balloon">🎈</div>
  <div class="balloon">🎈</div>

  <div class="container">

    <div class="card">

      <div class="cake">🎂</div>

      <h1>
        Happy Birthday
        <div class="name">Purvii! 🎉</div>
      </h1>

      <p class="message">
        May your special day be filled with
        happiness, love, laughter and lots of
        beautiful memories. ❤️
      </p>

      <p class="wish">
        ✨ Keep smiling and keep shining! ✨
      </p>

      <button onclick="celebrate()">
        🎁 Make a Wish 🎁
      </button>

      <div class="footer">
        Made with ❤️ especially for Purvii
      </div>

    </div>

  </div>

  <script>

    function createConfetti() {

      const colors = [
        "#ff4081",
        "#ffeb3b",
        "#00e5ff",
        "#76ff03",
        "#ff9800",
        "#ffffff",
        "#e040fb"
      ];

      for (let i = 0; i < 180; i++) {

        const confetti = document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left = Math.random() * 100 + "vw";

        confetti.style.background =
          colors[Math.floor(Math.random() * colors.length)];

        confetti.style.animationDuration =
          (Math.random() * 3 + 2) + "s";

        confetti.style.animationDelay =
          Math.random() * 2 + "s";

        confetti.style.transform =
          "rotate(" + Math.random() * 360 + "deg)";

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 6000);
      }
    }

    function celebrate() {

      createConfetti();

      const button = document.querySelector("button");

      button.innerHTML = "🎉 HAPPY BIRTHDAY PURVII! 🎉";

      setTimeout(() => {
        button.innerHTML = "🎁 Make a Wish 🎁";
      }, 3000);
    }

    // Initial confetti
    window.onload = function() {
      setTimeout(createConfetti, 500);
    };

  </script>

</body>
</html>
